[Logging]
level = "INFO"

[Logging.console]
enabled = true
level = "INFO"

[Logging.file]
enabled = false
level = "INFO"
path = "logs/daybreak.log"
max_bytes = 10485760
backup_count = 3

[GeneralHttpClient]
timeout = 5.0
max_connections = 100
max_keepalive_connections = 20
keepalive_expiry = 5.0

[GarminConnectClient]
api_key_string = ""
api_key_file = "config/API_KEY.txt"
http_client_pool_size = 10
base_url = "https://personal.connectapi.garmin.com"
timeout = 5.0
max_keepalive_connections = 10
keepalive_expiry = 5.0
